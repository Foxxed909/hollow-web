<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>hollow</title>
<style>
  :root {
    --bg:      #0d0d0d;
    --bg2:     #141414;
    --bg3:     #1a1a1a;
    --border:  #222;
    --text:    #e8e8e8;
    --dim:     #666;
    --accent:  #7c6af7;
    --accent2: #5b53c4;
    --green:   #4ade80;
    --red:     #f87171;
    --yellow:  #fbbf24;
    --code-bg: #111;
    --radius:  8px;
    --sidebar: 260px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 13px; overflow: hidden; }

  /* ── layout ── */
  #app { display: flex; height: 100%; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }

  /* ── sidebar ── */
  #sidebar {
    width: var(--sidebar); min-width: var(--sidebar);
    background: var(--bg2);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    overflow: hidden;
    transition: transform .2s ease;
  }
  #sidebar.hidden { transform: translateX(calc(-1 * var(--sidebar))); position: absolute; height: 100%; z-index: 50; }
  .sb-section { padding: 12px; border-bottom: 1px solid var(--border); }
  .sb-label { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin-bottom: 8px; }
  select, input[type=text], textarea {
    width: 100%; background: var(--bg3); border: 1px solid var(--border);
    color: var(--text); padding: 6px 8px; border-radius: var(--radius);
    font-family: inherit; font-size: 12px; outline: none;
  }
  select:focus, input:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 56px; max-height: 120px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 5px 10px; border-radius: var(--radius); border: 1px solid var(--border);
    background: var(--bg3); color: var(--text); cursor: pointer;
    font-family: inherit; font-size: 12px; transition: background .15s;
  }
  .btn:hover { background: var(--border); }
  .btn.accent { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.accent:hover { background: var(--accent2); }
  .btn-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }

  /* sessions */
  #session-list { max-height: 160px; overflow-y: auto; margin-top: 6px; }
  .session-item {
    padding: 5px 8px; border-radius: 4px; cursor: pointer;
    color: var(--dim); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .session-item:hover { background: var(--bg3); color: var(--text); }

  /* gh panel */
  #gh-panel { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  #gh-output {
    background: var(--code-bg); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 8px; font-size: 11px;
    color: var(--green); white-space: pre-wrap; min-height: 60px;
    max-height: 180px; overflow-y: auto;
  }
  .gh-btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  #gh-input { font-size: 11px; }

  /* ── main ── */
  #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  /* topbar */
  #topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-bottom: 1px solid var(--border);
    background: var(--bg2);
  }
  #menu-btn { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 18px; padding: 2px 6px; display: none; }
  #topbar-title { font-weight: bold; color: var(--accent); letter-spacing: .05em; }
  #topbar-model { color: var(--dim); font-size: 11px; margin-left: 4px; }
  #stream-badge {
    margin-left: auto; font-size: 10px; padding: 2px 7px;
    border-radius: 20px; border: 1px solid var(--border); color: var(--dim);
  }
  #stream-badge.on { border-color: var(--green); color: var(--green); }
  #clear-btn { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 12px; padding: 4px 8px; }
  #clear-btn:hover { color: var(--red); }

  /* messages */
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
  .msg { display: flex; gap: 10px; max-width: 100%; }
  .msg.user { flex-direction: row-reverse; }
  .msg-bubble {
    max-width: 72%; padding: 10px 13px; border-radius: var(--radius);
    line-height: 1.55; word-break: break-word;
  }
  .user .msg-bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 2px; }
  .assistant .msg-bubble { background: var(--bg3); border: 1px solid var(--border); border-bottom-left-radius: 2px; }
  .msg-avatar {
    width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; flex-shrink: 0; margin-top: 2px;
    background: var(--bg3); border: 1px solid var(--border);
  }
  .user .msg-avatar { background: var(--accent2); border-color: var(--accent); color: #fff; }
  /* code inside bubbles */
  .msg-bubble pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 4px; padding: 8px; overflow-x: auto; margin: 6px 0; font-size: 11px; }
  .msg-bubble code { background: var(--code-bg); padding: 1px 4px; border-radius: 3px; font-size: 11px; }
  .msg-bubble pre code { background: none; padding: 0; }
  /* system / info */
  .msg.info .msg-bubble { background: none; border: none; color: var(--dim); font-size: 11px; font-style: italic; max-width: 100%; }
  /* cursor blink */
  .cursor::after { content: '▋'; animation: blink .7s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ── input area ── */
  #input-area {
    padding: 10px 14px; border-top: 1px solid var(--border);
    background: var(--bg2); display: flex; gap: 8px; align-items: flex-end;
  }
  #user-input {
    flex: 1; resize: none; min-height: 36px; max-height: 140px;
    overflow-y: auto; padding: 8px 11px;
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--text);
    font-family: inherit; font-size: 13px; line-height: 1.4; outline: none;
  }
  #user-input:focus { border-color: var(--accent); }
  #send-btn {
    width: 36px; height: 36px; border-radius: var(--radius);
    background: var(--accent); border: none; color: #fff;
    cursor: pointer; font-size: 15px; flex-shrink: 0;
    transition: background .15s;
  }
  #send-btn:hover { background: var(--accent2); }
  #send-btn:disabled { opacity: .4; cursor: default; }

  /* ── scrollbar ── */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* ── mobile ── */
  @media (max-width: 640px) {
    #menu-btn { display: block; }
    #sidebar { position: absolute; height: calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); transform: translateX(calc(-1 * var(--sidebar))); }
    #sidebar.open { transform: translateX(0); }
    #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 40; }
    #overlay.show { display: block; }
    .msg-bubble { max-width: 88%; }
  }
</style>
</head>
<body>
<div id="overlay" onclick="closeSidebar()"></div>
<div id="app">

  <!-- sidebar -->
  <div id="sidebar">
    <div class="sb-section">
      <div class="sb-label">model</div>
      <select id="model-select" onchange="onModelChange()"><option>loading…</option></select>
      <div class="btn-row">
        <button class="btn" onclick="loadModels()">↻ refresh</button>
      </div>
    </div>
    <div class="sb-section">
      <div class="sb-label">system prompt</div>
      <textarea id="system-input" placeholder="(none)"></textarea>
    </div>
    <div class="sb-section">
      <div class="sb-label">sessions</div>
      <div class="btn-row">
        <button class="btn" onclick="saveSession()">save</button>
        <button class="btn" onclick="loadSessionList()">↻ list</button>
      </div>
      <div id="session-list"></div>
    </div>
    <div id="gh-panel">
      <div class="sb-label">github</div>
      <div class="gh-btn-grid">
        <button class="btn" onclick="ghCmd('/user')">me</button>
        <button class="btn" onclick="ghCmd('/user/repos?sort=updated&per_page=10')">repos</button>
        <button class="btn" onclick="ghCmdInput('issues')">issues</button>
        <button class="btn" onclick="ghCmdInput('prs')">PRs</button>
        <button class="btn" onclick="ghCmdInput('branches')">branches</button>
        <button class="btn" onclick="ghCmdInput('commits')">commits</button>
        <button class="btn" onclick="ghCmdInput('file')">file</button>
        <button class="btn" onclick="ghCmdInput('inject')">inject</button>
      </div>
      <input id="gh-input" type="text" placeholder="owner/repo [path]" />
      <pre id="gh-output">ready</pre>
    </div>
  </div>

  <!-- main -->
  <div id="main">
    <div id="topbar">
      <button id="menu-btn" onclick="toggleSidebar()">☰</button>
      <span id="topbar-title">hollow</span>
      <span id="topbar-model"></span>
      <span id="stream-badge" class="on">stream on</span>
      <button id="clear-btn" onclick="clearChat()" title="clear history">✕ clear</button>
    </div>
    <div id="messages"></div>
    <div id="input-area">
      <textarea id="user-input" rows="1" placeholder="message… (Enter send, Shift+Enter newline)"></textarea>
      <button id="send-btn" onclick="sendMessage()">↑</button>
    </div>
  </div>
</div>

<script>
// ── state ───────────────────────────────────────────────────────────────────
const S = {
  model:   localStorage.getItem('hollow_model')  || 'deepseek-v4.1-flash-uncensored',
  system:  localStorage.getItem('hollow_system') || '',
  msgs:    JSON.parse(localStorage.getItem('hollow_msgs') || '[]'),
  stream:  localStorage.getItem('hollow_stream') !== 'false',
  busy:    false,
};

// ── boot ────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('system-input').value = S.system;
  document.getElementById('topbar-model').textContent = S.model;
  updateStreamBadge();
  loadModels();
  renderHistory();
  loadSessionList();
  autoResize(document.getElementById('user-input'));
});

// ── models ──────────────────────────────────────────────────────────────────
async function loadModels() {
  const sel = document.getElementById('model-select');
  sel.innerHTML = '<option>loading…</option>';
  try {
    const r = await fetch('/api/models');
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    sel.innerHTML = '';
    for (const m of d.models) {
      const o = document.createElement('option');
      o.value = m; o.textContent = m;
      if (m === S.model) o.selected = true;
      sel.appendChild(o);
    }
    if (!d.models.includes(S.model)) {
      const o = document.createElement('option');
      o.value = S.model; o.textContent = S.model; o.selected = true;
      sel.prepend(o);
    }
  } catch(e) {
    sel.innerHTML = `<option value="${S.model}">${S.model}</option>`;
  }
}

function onModelChange() {
  S.model = document.getElementById('model-select').value;
  localStorage.setItem('hollow_model', S.model);
  document.getElementById('topbar-model').textContent = S.model;
}

// ── sidebar ──────────────────────────────────────────────────────────────────
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}

// ── stream toggle ─────────────────────────────────────────────────────────────
document.getElementById('stream-badge').addEventListener('click', () => {
  S.stream = !S.stream;
  localStorage.setItem('hollow_stream', S.stream);
  updateStreamBadge();
});
function updateStreamBadge() {
  const b = document.getElementById('stream-badge');
  b.textContent = S.stream ? 'stream on' : 'stream off';
  b.className = S.stream ? 'on' : '';
}

// ── messages ─────────────────────────────────────────────────────────────────
function renderHistory() {
  const c = document.getElementById('messages');
  c.innerHTML = '';
  for (const m of S.msgs) appendBubble(m.role, m.content);
  scrollBottom();
}

function appendBubble(role, content, streaming = false) {
  const c = document.getElementById('messages');
  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;
  if (role === 'info') wrap.className = 'msg info';
  const av = document.createElement('div');
  av.className = 'msg-avatar';
  av.textContent = role === 'user' ? 'P' : role === 'info' ? 'i' : '◆';
  const bub = document.createElement('div');
  bub.className = 'msg-bubble' + (streaming ? ' cursor' : '');
  bub.innerHTML = renderContent(content);
  if (role !== 'info') wrap.appendChild(av);
  wrap.appendChild(bub);
  c.appendChild(wrap);
  scrollBottom();
  return bub;
}

function renderContent(text) {
  // minimal markdown: code blocks, inline code, bold
  return text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/```([\s\S]*?)```/g, (_,c) => `<pre><code>${c.trim()}</code></pre>`)
    .replace(/`([^`]+)`/g, (_,c) => `<code>${c}</code>`)
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/\n/g, '<br>');
}

function scrollBottom() {
  const c = document.getElementById('messages');
  c.scrollTop = c.scrollHeight;
}

function clearChat() {
  S.msgs = [];
  localStorage.removeItem('hollow_msgs');
  document.getElementById('messages').innerHTML = '';
  appendBubble('info', 'history cleared');
}

// ── send ──────────────────────────────────────────────────────────────────────
document.getElementById('user-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

async function sendMessage() {
  if (S.busy) return;
  const inp = document.getElementById('user-input');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = ''; inp.style.height = '';

  // system prompt live update
  S.system = document.getElementById('system-input').value.trim();
  localStorage.setItem('hollow_system', S.system);

  // local commands
  if (text.startsWith('/')) {
    if (handleLocalCmd(text)) return;
  }

  S.msgs.push({ role: 'user', content: text });
  localStorage.setItem('hollow_msgs', JSON.stringify(S.msgs));
  appendBubble('user', text);

  setBusy(true);
  if (S.stream) await streamResponse();
  else await fetchResponse();
  setBusy(false);
}

function handleLocalCmd(cmd) {
  const p = cmd.trim().split(/\s+/);
  if (p[0] === '/clear') { clearChat(); return true; }
  if (p[0] === '/model' && p[1]) { S.model = p[1]; localStorage.setItem('hollow_model',S.model); document.getElementById('topbar-model').textContent=S.model; appendBubble('info',`model → ${S.model}`); return true; }
  if (p[0] === '/stream') { S.stream=!S.stream; localStorage.setItem('hollow_stream',S.stream); updateStreamBadge(); appendBubble('info',`stream ${S.stream?'on':'off'}`); return true; }
  if (p[0] === '/save') { saveSession(); return true; }
  if (p[0] === '/sessions') { loadSessionList(); appendBubble('info','session list refreshed in sidebar'); return true; }
  if (p[0] === '/system') { const sys=p.slice(1).join(' '); S.system=sys; document.getElementById('system-input').value=sys; localStorage.setItem('hollow_system',sys); appendBubble('info',`system ${sys?'set':'cleared'}`); return true; }
  if (p[0] === '/gh' && p[1]) { handleGhCmd(p.slice(1)); return true; }
  if (p[0] === '/help') { appendBubble('info','commands: /clear /model <name> /stream /save /sessions /system <text> /gh me|repos|issues|prs|commits|branches|file|search|inject'); return true; }
  return false;
}

async function streamResponse() {
  const bub = appendBubble('assistant', '', true);
  let full = '';
  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: S.msgs, model: S.model, system: S.system }),
    });
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const raw = line.slice(6).trim();
        if (raw === '[DONE]') break;
        try {
          const d = JSON.parse(raw);
          if (d.error) { full += `\n[error: ${d.error}]`; break; }
          if (d.delta) { full += d.delta; bub.innerHTML = renderContent(full); scrollBottom(); }
        } catch {}
      }
    }
  } catch(e) { full = `[error: ${e.message}]`; }
  bub.classList.remove('cursor');
  bub.innerHTML = renderContent(full);
  S.msgs.push({ role: 'assistant', content: full });
  localStorage.setItem('hollow_msgs', JSON.stringify(S.msgs));
}

async function fetchResponse() {
  appendBubble('info', '…');
  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: S.msgs, model: S.model, system: S.system, stream: false }),
    });
    const d = await r.json();
    const text = d.choices?.[0]?.message?.content || d.error || '[no response]';
    document.getElementById('messages').lastChild.remove();
    appendBubble('assistant', text);
    S.msgs.push({ role: 'assistant', content: text });
    localStorage.setItem('hollow_msgs', JSON.stringify(S.msgs));
  } catch(e) {
    document.getElementById('messages').lastChild.remove();
    appendBubble('info', `error: ${e.message}`);
  }
}

function setBusy(v) {
  S.busy = v;
  document.getElementById('send-btn').disabled = v;
  document.getElementById('user-input').disabled = v;
}

// ── sessions ──────────────────────────────────────────────────────────────────
function saveSession() {
  const name = new Date().toISOString().slice(0,16).replace('T','_').replace(':','');
  const all = JSON.parse(localStorage.getItem('hollow_session_index') || '[]');
  all.unshift(name);
  localStorage.setItem('hollow_session_index', JSON.stringify(all.slice(0,30)));
  localStorage.setItem(`hollow_sess_${name}`, JSON.stringify({ model: S.model, system: S.system, msgs: S.msgs }));
  loadSessionList();
  appendBubble('info', `saved: ${name}`);
}

function loadSessionList() {
  const list = document.getElementById('session-list');
  const all = JSON.parse(localStorage.getItem('hollow_session_index') || '[]');
  list.innerHTML = '';
  for (const n of all.slice(0,15)) {
    const d = document.createElement('div');
    d.className = 'session-item';
    d.textContent = n;
    d.onclick = () => restoreSession(n);
    list.appendChild(d);
  }
}

function restoreSession(name) {
  const raw = localStorage.getItem(`hollow_sess_${name}`);
  if (!raw) return;
  const d = JSON.parse(raw);
  S.model = d.model; S.system = d.system; S.msgs = d.msgs;
  document.getElementById('system-input').value = S.system;
  document.getElementById('topbar-model').textContent = S.model;
  localStorage.setItem('hollow_model', S.model);
  localStorage.setItem('hollow_system', S.system);
  localStorage.setItem('hollow_msgs', JSON.stringify(S.msgs));
  renderHistory();
  appendBubble('info', `loaded: ${name} (${S.msgs.length/2|0} turns)`);
  closeSidebar();
}

// ── github ───────────────────────────────────────────────────────────────────
async function ghApi(path, method='GET', payload=null) {
  const r = await fetch('/api/github', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ path, method, payload }),
  });
  return r.json();
}

async function ghCmd(path) {
  const out = document.getElementById('gh-output');
  out.textContent = 'loading…';
  try {
    const d = await ghApi(path);
    if (Array.isArray(d)) {
      out.textContent = d.map(r => r.full_name || r.name || r.login || JSON.stringify(r)).join('\n');
    } else {
      out.textContent = JSON.stringify(d, null, 2).slice(0, 1200);
    }
  } catch(e) { out.textContent = `error: ${e.message}`; }
}

async function ghCmdInput(type) {
  const inp = document.getElementById('gh-input').value.trim();
  const parts = inp.split(/\s+/);
  const repo = parts[0]; const path = parts[1] || '';
  const out = document.getElementById('gh-output');
  out.textContent = 'loading…';
  try {
    let data;
    if (type === 'issues')   data = await ghApi(`/repos/${repo}/issues?state=open&per_page=10`);
    if (type === 'prs')      data = await ghApi(`/repos/${repo}/pulls?state=open&per_page=10`);
    if (type === 'branches') data = await ghApi(`/repos/${repo}/branches`);
    if (type === 'commits')  data = await ghApi(`/repos/${repo}/commits?per_page=8`);
    if (type === 'file')     data = await ghApi(`/repos/${repo}/contents/${path}`);
    if (type === 'inject') {
      data = await ghApi(`/repos/${repo}/contents/${path}`);
      let content = '';
      if (Array.isArray(data)) {
        content = data.map(f => f.name).join('\n');
      } else {
        content = atob(data.content.replace(/\n/g,''));
        content = content.slice(0, 4000);
      }
      const msg = `[injected: ${repo}/${path}]\n\`\`\`\n${content}\n\`\`\``;
      S.msgs.push({ role: 'user', content: msg });
      localStorage.setItem('hollow_msgs', JSON.stringify(S.msgs));
      appendBubble('user', msg);
      out.textContent = `injected ${repo}/${path} into context`;
      return;
    }
    if (Array.isArray(data)) {
      out.textContent = data.filter(i => !i.pull_request)
        .map(i => `#${i.number || ''} ${i.title || i.name || i.sha?.slice(0,7) || i.login || ''}`).join('\n').slice(0,1000);
    } else {
      out.textContent = JSON.stringify(data, null, 2).slice(0, 1200);
    }
  } catch(e) { out.textContent = `error: ${e.message}`; }
}

async function handleGhCmd(parts) {
  const sub = parts[0].toLowerCase();
  const a1 = parts[1] || ''; const a2 = parts[2] || '';
  const out = document.getElementById('gh-output');
  out.textContent = 'loading…';
  if (sub==='me') await ghCmd('/user');
  else if (sub==='repos') await ghCmd('/user/repos?sort=updated&per_page=10');
  else if (sub==='issues' && a1) await ghCmdByType('issues',a1,a2);
  else if (sub==='prs' && a1) await ghCmdByType('prs',a1,a2);
  else { out.textContent = `gh: unhandled ${sub}`; }
  appendBubble('info', `gh ${sub} → see sidebar`);
}

// ── auto-resize textarea ─────────────────────────────────────────────────────
function autoResize(el) {
  el.addEventListener('input', () => {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 140) + 'px';
  });
}
</script>
</body>
